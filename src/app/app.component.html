<div class="container">
    <header>
        <h1>Текстовий аналізатор</h1>
        <p>Вставте текст для аналізу</p>
    </header>

    <div class="main-content">
        <div class="left-section">
            <div class="text-input-section">
        <textarea
                [(ngModel)]="text"
                (input)="analyzeText()"
                placeholder="Введіть або вставте текст для аналізу..."
                class="text-input">
        </textarea>
                <button (click)="clearText()" class="clear-btn">Очистити</button>
            </div>

            <div class="top-words" *ngIf="topWords.length > 0">
                <h3>Найчастіші слова</h3>
                <div class="word-list">
                    <div class="word-item" *ngFor="let item of topWords">
                        <span class="word">{{item.word}}</span>
                        <span class="count">{{item.count}}</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="stats-section">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value">{{wordCount}}</div>
                    <div class="stat-label">Слова</div>
                    <div class="progress-bar">
                        <div class="progress-fill" [style.width.%]="wordProgress"></div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-value">{{charCount}}</div>
                    <div class="stat-label">Символи</div>
                    <div class="progress-bar">
                        <div class="progress-fill" [style.width.%]="charProgress"></div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-value">{{charCountNoSpaces}}</div>
                    <div class="stat-label">Без пробілів</div>
                </div>

                <div class="stat-card">
                    <div class="stat-value">{{sentenceCount}}</div>
                    <div class="stat-label">Речення</div>
                    <div class="progress-bar">
                        <div class="progress-fill" [style.width.%]="sentenceProgress"></div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-value">{{readingTime}} хв</div>
                    <div class="stat-label">Час читання</div>
                </div>

                <div class="stat-card readability">
                    <div class="stat-value">{{readability}}</div>
                    <div class="stat-label">Читабельність</div>
                </div>
            </div>
        </div>
    </div>
</div>
